$font = Monospace
$wallpaper = /home/dani/Pictures/wallpapers/911.png
$backgroundCol = rgba(29, 19, 56, 0.6)
$color4 = rgba(180, 140, 255, 0.9)
$color5 = rgba(220, 180, 255, 0.9)
$color9 = rgba(4, 72, 115, 0.6)
$color10 = rgba(107, 29, 86, 0.6)

general {
    hide_cursor = true
}

auth {
    fingerprint {
        enabled = true
        ready_message = Scan fingerprint to unlock
        present_message = Scanning...
        retry_delay = 250 # in milliseconds
    }
}


background {
    monitor =
    path = $wallpaper
    blur_size = 2
    blur_passes = 2
    brightness = .6
}
input-field {
    monitor =
    size = 25%, 4%
    outline_thickness = 0
    dots_rounding = 4
    dots_spacing = .5
    inner_color = $backgroundCol
    outer_color = $backgroundCol $backgroundCol
    check_color= $backgroundCol $backgroundCol
    fail_color= $backgroundCol $backgroundCol
    font_color = $color9
    font_family = CodeNewRoman Nerd Font Propo
    fade_on_empty = true
    shadow_color = rgba(0,0,0,0.5)
    shadow_passes = 2
    shadow_size = 2
    rounding = 20
    placeholder_text = <i></i>
    position = 0, -100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"<b>%H</b>"
    color = $color9
    font_size = 200
    font_family = CodeNewRoman Nerd Font Propo
    shadow_passes = 0
    shadow_size = 5
    position = -120, 410
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] date +"<b>%M</b>"
    color = $color10
    font_size = 200
    font_family = CodeNewRoman Nerd Font Propo
    shadow_passes = 0
    shadow_size = 5
    position = 120, 230
    halign = center
    valign = center
}
